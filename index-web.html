<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Dostępności Cyfrowej - Generator Raportów (Web Version)</title>
    <link rel="stylesheet" href="style.css">
    <!-- Quill Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
        <p>Ładowanie...</p>
    </div>

    <div class="container" id="main-container">
        <header>
            <h1 id="main-title">Monitoring strony - <span id="current-date"></span></h1>
            <div class="header-actions">
                <div id="user-info" class="user-info"></div>
                <button type="button" id="manage-config-btn" class="btn btn-small btn-secondary" title="Zarządzaj konfiguracją">⚙️ Konfiguracja</button>
                <button type="button" id="logout-btn" class="btn btn-small btn-danger" title="Wyloguj się">🚪 Wyloguj</button>
            </div>
        </header>

        <form id="report-form">
            <section class="form-section">
                <div class="form-group">
                    <label for="monitoring-date">Data monitoringu:</label>
                    <input type="date" id="monitoring-date" required>
                </div>

                <div class="form-group">
                    <label for="wykonawca">Wykonawca:</label>
                    <input type="text" id="wykonawca" readonly>
                </div>

                <div class="form-group">
                    <label for="klient">Klient:</label>
                    <select id="klient" required>
                        <option value="">-- Wybierz klienta --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="zakres">Zakres raportu:</label>
                    <textarea id="zakres" rows="3" readonly></textarea>
                </div>

                <div class="form-group">
                    <label>Okres monitoringu:</label>
                    <div class="date-range">
                        <input type="date" id="okres-od" placeholder="Od" required>
                        <span>do</span>
                        <input type="date" id="okres-do" placeholder="Do" required>
                    </div>
                </div>
            </section>

            <section class="content-section">
                <div class="section-header">
                    <h2>Lista zweryfikowanych treści</h2>
                </div>

                <div id="content-list" class="content-list">
                    <!-- Dynamic content items will be added here -->
                </div>
            </section>

            <section class="actions-section">
                <div class="action-buttons">
                    <button type="button" id="save-report-btn" class="btn btn-success">💾 Zapisz raport</button>
                    <button type="button" id="load-report-btn" class="btn btn-info">📂 Wczytaj raport</button>
                    <button type="button" id="export-pdf-btn" class="btn btn-danger">🖨️ Podgląd i drukuj</button>
                </div>
                <div class="autosave-info">
                    <span id="save-status">Status: <span id="save-status-text">Niezapisany</span></span>
                </div>
            </section>
        </form>
    </div>

    <!-- Configuration Modal -->
    <div id="config-modal" class="modal" style="display: none;">
        <div class="modal-content config-modal-content">
            <h2>Konfiguracja systemu</h2>

            <div class="config-tabs">
                <button type="button" class="config-tab active" data-tab="wykonawca">Wykonawca</button>
                <button type="button" class="config-tab" data-tab="klienci">Klienci</button>
                <button type="button" class="config-tab" data-tab="bledy">Błędy</button>
                <button type="button" class="config-tab" data-tab="poprawki">Poprawki</button>
            </div>

            <!-- Wykonawca Tab -->
            <div id="tab-wykonawca" class="config-tab-content active">
                <div class="form-group">
                    <label for="wykonawca-name">Nazwa wykonawcy:</label>
                    <input type="text" id="wykonawca-name" placeholder="Wpisz nazwę wykonawcy">
                </div>
                <button type="button" id="save-wykonawca-btn" class="btn btn-primary">Zapisz</button>
            </div>

            <!-- Klienci Tab -->
            <div id="tab-klienci" class="config-tab-content">
                <div class="config-list-header">
                    <h3>Lista klientów</h3>
                    <button type="button" id="add-klient-btn" class="btn btn-primary btn-small">+ Dodaj</button>
                </div>
                <div id="klienci-list" class="config-list">
                    <!-- Klienci will be loaded here -->
                </div>
            </div>

            <!-- Błędy Tab -->
            <div id="tab-bledy" class="config-tab-content">
                <div class="config-list-header">
                    <h3>Szablony błędów</h3>
                    <button type="button" id="add-blad-btn" class="btn btn-primary btn-small">+ Dodaj</button>
                </div>
                <div id="bledy-list" class="config-list">
                    <!-- Templates will be loaded here -->
                </div>
            </div>

            <!-- Poprawki Tab -->
            <div id="tab-poprawki" class="config-tab-content">
                <div class="config-list-header">
                    <h3>Szablony poprawek</h3>
                    <button type="button" id="add-poprawka-btn" class="btn btn-primary btn-small">+ Dodaj</button>
                </div>
                <div id="poprawki-list" class="config-list">
                    <!-- Templates will be loaded here -->
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" id="close-config-btn" class="btn btn-secondary">Zamknij</button>
            </div>
        </div>
    </div>

    <!-- Load Report Modal -->
    <div id="load-report-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>Wczytaj raport</h2>
            <div id="reports-list" class="reports-list">
                <!-- Reports will be loaded here -->
            </div>
            <div class="modal-actions">
                <button type="button" id="close-load-modal-btn" class="btn btn-secondary">Anuluj</button>
            </div>
        </div>
    </div>

    <!-- Hidden template for content items -->
    <template id="content-item-template">
        <div class="content-item">
            <div class="content-item-header">
                <h3>Element <span class="item-number"></span></h3>
                <button type="button" class="btn-remove" title="Usuń element">✕</button>
            </div>
            <div class="content-item-body">
                <div class="form-group">
                    <label>Typ treści:</label>
                    <select class="content-type" required>
                        <option value="">-- Wybierz typ --</option>
                        <option value="post">Post</option>
                        <option value="strona">Strona</option>
                        <option value="dokument">Dokument</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Tytuł:</label>
                    <div class="title-input-wrapper">
                        <input type="text" class="content-title" placeholder="Tytuł strony (wpisz lub pobierz automatycznie)">
                        <button type="button" class="btn-fetch-title btn btn-secondary btn-small" title="Pobierz tytuł ze strony">🔄</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Adres URL:</label>
                    <input type="url" class="content-url" placeholder="https://example.com" required>
                </div>

                <div class="form-group">
                    <label>Zidentyfikowane problemy:</label>
                    <div class="template-selector">
                        <select class="problems-template-select">
                            <option value="">-- Wybierz szablon błędu --</option>
                        </select>
                        <button type="button" class="btn-insert-template btn btn-secondary btn-small" data-target="problems">+ Wstaw</button>
                    </div>
                    <div class="editor-wrapper">
                        <div class="content-problems-editor"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Wprowadzone poprawki:</label>
                    <div class="template-selector">
                        <select class="fixes-template-select">
                            <option value="">-- Wybierz szablon poprawki --</option>
                        </select>
                        <button type="button" class="btn-insert-template btn btn-secondary btn-small" data-target="fixes">+ Wstaw</button>
                    </div>
                    <div class="editor-wrapper">
                        <div class="content-fixes-editor"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Zdjęcia:</label>
                    <button type="button" class="btn-add-screenshot btn btn-secondary btn-small">+ Dodaj zdjęcie</button>
                    <div class="screenshots-container">
                        <!-- Screenshots will be added here dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Hidden template for screenshot items -->
    <template id="screenshot-item-template">
        <div class="screenshot-item">
            <div class="screenshot-preview">
                <img src="" alt="Zdjęcie">
            </div>
            <div class="screenshot-description-wrapper">
                <label>Opis zdjęcia:</label>
                <textarea class="screenshot-description" rows="2" placeholder="Opcjonalny opis zdjęcia..."></textarea>
            </div>
            <div class="screenshot-timestamp"></div>
            <button type="button" class="btn-remove-screenshot-item" title="Usuń zdjęcie">✕ Usuń</button>
        </div>
    </template>

    <!-- Floating Add Element Button -->
    <button type="button" id="add-content-btn" class="btn btn-primary floating-add-btn">+ Dodaj element</button>

    <!-- Quill Editor -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="script-web.js"></script>
    <script src="pdf-export.js"></script>
</body>
</html>
