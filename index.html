<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Dostępności Cyfrowej - Generator Raportów</title>
    <link rel="stylesheet" href="govuk-style.css">
    <!-- Quill Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="govuk-loader-overlay">
        <div style="text-align: center;">
            <div class="govuk-loader"></div>
            <p class="govuk-body govuk-!-margin-bottom-0" style="margin-top: 15px;">Ładowanie...</p>
        </div>
    </div>

    <!-- GOV.UK Header -->
    <header class="govuk-header" role="banner">
        <div class="govuk-width-container">
            <div class="govuk-header__container">
                <div class="govuk-header__logo">
                    Monitoring Dostępności
                </div>
                <div class="govuk-header__content">
                    <div id="user-info" class="user-info-govuk"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation Bar -->
    <div class="govuk-nav-bar">
        <div class="govuk-width-container">
            <nav class="govuk-nav-bar__content">
                <a href="client-view.html" class="govuk-button govuk-button--secondary govuk-button--small">Widok klienta</a>
                <a href="scans.html" class="govuk-button govuk-button--secondary govuk-button--small">Skany Oobee</a>
                <button type="button" id="manage-config-btn" class="govuk-button govuk-button--secondary govuk-button--small">Konfiguracja</button>
                <button type="button" id="logout-btn" class="govuk-button govuk-button--warning govuk-button--small">Wyloguj</button>
            </nav>
        </div>
    </div>

    <!-- Main Content -->
    <div class="govuk-width-container">
        <main class="govuk-main-wrapper" id="main-content" role="main">

            <h1 class="govuk-heading-xl">
                Monitoring strony
                <span class="govuk-caption-xl" id="current-date"></span>
            </h1>

            <form id="report-form">
                <!-- Basic Information Section -->
                <div class="govuk-panel govuk-!-margin-bottom-6">
                    <h2 class="govuk-heading-m">Informacje podstawowe</h2>

                    <div class="govuk-form-group">
                        <label class="govuk-label" for="monitoring-date">
                            Data monitoringu
                        </label>
                        <input class="govuk-input" id="monitoring-date" type="date" required style="max-width: 200px;">
                    </div>

                    <div class="govuk-form-group">
                        <label class="govuk-label" for="wykonawca">
                            Wykonawca
                        </label>
                        <input class="govuk-input" id="wykonawca" type="text" readonly>
                    </div>

                    <div class="govuk-form-group">
                        <label class="govuk-label" for="klient">
                            Klient
                        </label>
                        <select class="govuk-select" id="klient" required style="max-width: 400px;">
                            <option value="">-- Wybierz klienta --</option>
                        </select>
                    </div>

                    <div class="govuk-form-group">
                        <label class="govuk-label" for="zakres">
                            Zakres raportu
                        </label>
                        <textarea class="govuk-textarea" id="zakres" rows="3" readonly></textarea>
                    </div>

                    <div class="govuk-form-group">
                        <label class="govuk-label">
                            Okres monitoringu
                        </label>
                        <div class="govuk-date-range">
                            <div>
                                <label class="govuk-label govuk-label--s" for="okres-od">Od</label>
                                <input class="govuk-input" id="okres-od" type="date" required style="max-width: 180px;">
                            </div>
                            <div>
                                <label class="govuk-label govuk-label--s" for="okres-do">Do</label>
                                <input class="govuk-input" id="okres-do" type="date" required style="max-width: 180px;">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Content List Section -->
                <h2 class="govuk-heading-m">Lista zweryfikowanych treści</h2>

                <div id="content-list" class="content-list">
                    <!-- Dynamic content items will be added here -->
                </div>

                <!-- Actions Section -->
                <div class="govuk-panel govuk-!-margin-top-6">
                    <div class="govuk-button-group">
                        <button type="button" id="save-report-btn" class="govuk-button">
                            Zapisz raport
                        </button>
                        <button type="button" id="load-report-btn" class="govuk-button govuk-button--secondary">
                            Wczytaj raport
                        </button>
                        <button type="button" id="export-pdf-btn" class="govuk-button govuk-button--secondary">
                            Podgląd i drukuj
                        </button>
                    </div>
                    <p class="govuk-body-s govuk-!-margin-top-3 govuk-!-margin-bottom-0">
                        Status: <strong id="save-status-text">Niezapisany</strong>
                    </p>
                </div>
            </form>

        </main>
    </div>

    <!-- Configuration Modal -->
    <div id="config-modal" class="govuk-modal" style="display: none;">
        <div class="govuk-modal__overlay"></div>
        <div class="govuk-modal__content govuk-modal__content--wide">
            <h2 class="govuk-heading-l">Konfiguracja systemu</h2>

            <ul class="govuk-tabs__list">
                <li class="govuk-tabs__list-item">
                    <button type="button" class="govuk-tabs__tab govuk-tabs__tab--selected config-tab" data-tab="wykonawca">Wykonawca</button>
                </li>
                <li class="govuk-tabs__list-item">
                    <button type="button" class="govuk-tabs__tab config-tab" data-tab="klienci">Klienci</button>
                </li>
                <li class="govuk-tabs__list-item">
                    <button type="button" class="govuk-tabs__tab config-tab" data-tab="bledy">Błędy</button>
                </li>
                <li class="govuk-tabs__list-item">
                    <button type="button" class="govuk-tabs__tab config-tab" data-tab="poprawki">Poprawki</button>
                </li>
            </ul>

            <!-- Wykonawca Tab -->
            <div id="tab-wykonawca" class="govuk-tabs__panel config-tab-content">
                <div class="govuk-form-group">
                    <label class="govuk-label" for="wykonawca-name">
                        Nazwa wykonawcy
                    </label>
                    <input class="govuk-input" id="wykonawca-name" type="text" placeholder="Wpisz nazwę wykonawcy">
                </div>
                <button type="button" id="save-wykonawca-btn" class="govuk-button">Zapisz</button>
            </div>

            <!-- Klienci Tab -->
            <div id="tab-klienci" class="govuk-tabs__panel govuk-tabs__panel--hidden config-tab-content">
                <div class="config-list-header">
                    <h3 class="govuk-heading-s">Lista klientów</h3>
                    <button type="button" id="add-klient-btn" class="govuk-button govuk-button--small">+ Dodaj</button>
                </div>
                <div id="klienci-list" class="config-list">
                    <!-- Klienci will be loaded here -->
                </div>
            </div>

            <!-- Błędy Tab -->
            <div id="tab-bledy" class="govuk-tabs__panel govuk-tabs__panel--hidden config-tab-content">
                <div class="config-list-header">
                    <h3 class="govuk-heading-s">Szablony błędów</h3>
                    <button type="button" id="add-blad-btn" class="govuk-button govuk-button--small">+ Dodaj</button>
                </div>
                <div id="bledy-list" class="config-list">
                    <!-- Templates will be loaded here -->
                </div>
            </div>

            <!-- Poprawki Tab -->
            <div id="tab-poprawki" class="govuk-tabs__panel govuk-tabs__panel--hidden config-tab-content">
                <div class="config-list-header">
                    <h3 class="govuk-heading-s">Szablony poprawek</h3>
                    <button type="button" id="add-poprawka-btn" class="govuk-button govuk-button--small">+ Dodaj</button>
                </div>
                <div id="poprawki-list" class="config-list">
                    <!-- Templates will be loaded here -->
                </div>
            </div>

            <div class="govuk-button-group govuk-!-margin-top-4">
                <button type="button" id="close-config-btn" class="govuk-button govuk-button--secondary">Zamknij</button>
            </div>
        </div>
    </div>

    <!-- Load Report Modal -->
    <div id="load-report-modal" class="govuk-modal" style="display: none;">
        <div class="govuk-modal__overlay"></div>
        <div class="govuk-modal__content">
            <h2 class="govuk-heading-l">Wczytaj raport</h2>
            <div id="reports-list" class="reports-list">
                <!-- Reports will be loaded here -->
            </div>
            <div class="govuk-button-group govuk-!-margin-top-4">
                <button type="button" id="close-load-modal-btn" class="govuk-button govuk-button--secondary">Anuluj</button>
            </div>
        </div>
    </div>

    <!-- Hidden template for content items -->
    <template id="content-item-template">
        <div class="content-item govuk-panel">
            <div class="content-item-header">
                <h3 class="govuk-heading-s govuk-!-margin-bottom-0">Element <span class="item-number"></span></h3>
                <button type="button" class="btn-remove govuk-button govuk-button--warning govuk-button--small">Usuń</button>
            </div>
            <div class="content-item-body">
                <div class="govuk-form-group">
                    <label class="govuk-label">Typ treści</label>
                    <select class="govuk-select content-type" required>
                        <option value="">-- Wybierz typ --</option>
                        <option value="post">Post</option>
                        <option value="strona">Strona</option>
                        <option value="dokument">Dokument</option>
                    </select>
                </div>

                <div class="govuk-form-group">
                    <label class="govuk-label">Tytuł</label>
                    <div class="title-input-wrapper">
                        <input type="text" class="govuk-input content-title" placeholder="Tytuł strony (wpisz lub pobierz automatycznie)">
                        <button type="button" class="btn-fetch-title govuk-button govuk-button--secondary govuk-button--small">Pobierz</button>
                    </div>
                </div>

                <div class="govuk-form-group">
                    <label class="govuk-label">Adres URL</label>
                    <input type="url" class="govuk-input content-url" placeholder="https://example.com" required>
                </div>

                <div class="govuk-form-group">
                    <label class="govuk-label">Zidentyfikowane problemy</label>
                    <div class="template-selector">
                        <select class="govuk-select problems-template-select">
                            <option value="">-- Wybierz szablon błędu --</option>
                        </select>
                        <button type="button" class="btn-insert-template govuk-button govuk-button--secondary govuk-button--small" data-target="problems">Wstaw</button>
                    </div>
                    <div class="editor-wrapper">
                        <div class="content-problems-editor"></div>
                    </div>
                </div>

                <div class="govuk-form-group">
                    <label class="govuk-label">Wprowadzone poprawki</label>
                    <div class="template-selector">
                        <select class="govuk-select fixes-template-select">
                            <option value="">-- Wybierz szablon poprawki --</option>
                        </select>
                        <button type="button" class="btn-insert-template govuk-button govuk-button--secondary govuk-button--small" data-target="fixes">Wstaw</button>
                    </div>
                    <div class="editor-wrapper">
                        <div class="content-fixes-editor"></div>
                    </div>
                </div>

                <div class="govuk-form-group">
                    <label class="govuk-label">Zdjęcia</label>
                    <button type="button" class="btn-add-screenshot govuk-button govuk-button--secondary govuk-button--small">+ Dodaj zdjęcie</button>
                    <div class="screenshots-container">
                        <!-- Screenshots will be added here dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Hidden template for screenshot items -->
    <template id="screenshot-item-template">
        <div class="screenshot-item govuk-inset-text">
            <div class="screenshot-preview">
                <img src="" alt="Zdjęcie">
            </div>
            <div class="govuk-form-group govuk-!-margin-top-2">
                <label class="govuk-label govuk-label--s">Opis zdjęcia</label>
                <textarea class="govuk-textarea screenshot-description" rows="2" placeholder="Opcjonalny opis zdjęcia..."></textarea>
            </div>
            <div class="screenshot-timestamp govuk-body-s"></div>
            <button type="button" class="btn-remove-screenshot-item govuk-button govuk-button--warning govuk-button--small">Usuń zdjęcie</button>
        </div>
    </template>

    <!-- Floating Add Element Button -->
    <button type="button" id="add-content-btn" class="floating-add-btn govuk-button">+ Dodaj element</button>

    <!-- Quill Editor -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="script-web.js"></script>
    <script src="pdf-export.js"></script>
</body>
</html>
